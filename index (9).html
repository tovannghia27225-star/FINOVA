var(--line);border-radius:var(--radius);padding:19px}.stat strong{font-size:28px;display:block;margin-top:8px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.sectionhead h2{font-size:19px;margin:0}.template-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.template{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}.template:hover{border-color:var(--gold);transform:translateY(-2px)}.thumb{height:190px;background:linear-gradient(145deg,#f6f2e9,#d8deef);color:#20243b;padding:18px;overflow:hidden;position:relative}.thumb .fake-name{font-weight:900;font-size:18px;border-bottom:3px solid #b99a5a;padding-bottom:8px}.thumb .fake-line{height:5px;background:#b6bed0;margin-top:10px;border-radius:9px;width:80%}.thumb .fake-line.short{width:48%}.thumb.dark{background:linear-gradient(145deg,#20283d,#44506c);color:#fff}.thumb.rose{background:linear-gradient(145deg,#f7e7e5,#e6c7ca)}.thumb.lilac{background:linear-gradient(145deg,#eeeaff,#c9c3ef)}.template-info{padding:14px}.template-info h3{margin:0 0 4px;font-size:15px}.tag{font-size:11px;color:var(--gold);background:#3a3329;padding:4px 8px;border-radius:20px;display:inline-block;margin:3px 3px 0 0}.filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select,.filters input,.filters select{width:100%;background:#0f1426;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;outline:none}.field textarea{min-height:88px;resize:vertical}.filters input{max-width:330px}.editor{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.editorform{max-height:calc(100vh - 145px);overflow:auto}.previewwrap{background:#242a40;border-radius:17px;padding:24px;min-height:650px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.paper{background:white;color:#202437;width:100%;max-width:760px;min-height:950px;padding:48px 55px;box-shadow:0 15px 50px #0006;font-family:Arial,sans-serif}.paper h1{font-size:31px;margin:0;color:#202a43}.paper h2{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;border-bottom:2px solid #c4a568;padding-bottom:6px;margin:24px 0 9px;color:#27314b}.paper p{font-size:13px;white-space:pre-line;margin:5px 0;color:#434b60}.paper .role{color:#a27d38;font-weight:bold;margin:5px 0 15px}.paper .contact{font-size:11px;color:#687086}.portfolio-paper{background:linear-gradient(145deg,#171d33,#353a60);color:white;border-radius:4px}.portfolio-paper h1{color:white;font-size:46px}.portfolio-paper h2{color:#e8ca87;border-color:#e8ca87}.portfolio-paper p{color:#d5d9eb}.poster-paper{background:#f3ead9;color:#1c2336;text-align:center;display:flex;flex-direction:column;justify-content:center}.poster-paper h1{font-size:45px;color:#202743}.poster-paper h2{font-size:22px;border:0;color:#a07835}.poster-paper p{font-size:17px}.auth{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 20% 10%,#32345b,transparent 35%),var(--bg)}.authbox{width:min(950px,100%);display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden}.authart{padding:45px;background:linear-gradient(145deg,#242844,#5b4b46);display:flex;flex-direction:column;justify-content:space-between}.authform{padding:42px}.authform h2{margin:0 0 5px}.toast{position:fixed;bottom:20px;right:20px;background:#252d48;border:1px solid var(--line);padding:12px 17px;border-radius:12px;z-index:50}.empty{padding:45px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#070a14c9;z-index:20;display:grid;place-items:center;padding:20px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(560px,100%)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.mobilemenu{display:none}

const SUPABASE_URL='https://tjrbuixjmcgqgfxzdswi.supabase.co';
const SUPABASE_KEY='sb_publishable_NzJCKHCmcXobu1KNMW3x9A_hL4-8gvy';

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const templates=[
{id:'cv-clean',name:'Executive Clean',type:'cv',category:'Corporate',style:'Minimal',level:'Senior',tone:'',theme:'light',desc:'Bố cục chuyên nghiệp, rõ ràng, thân thiện ATS.'},
{id:'cv-ats',name:'ATS Professional',type:'cv',category:'ATS',style:'Minimal',level:'Fresher',theme:'light',desc:'Tối ưu khả năng đọc của hệ thống tuyển dụng.'},

{id:'cv-hr',name:'People & Culture',type:'cv',category:'HR',style:'Corporate',level:'Junior',theme:'light',desc:'Phù hợp nhân sự, hành chính và tuyển dụng.'},
{id:'cv-finance',name:'Finance Pro',type:'cv',category:'Finance',style:'Corporate',level:'Senior',theme:'light',desc:'Tối giản, ưu tiên thành tích và số liệu.'},
{id:'cv-student',name:'Graduate Starter',type:'cv',category:'Student',style:'Minimal',level:'Student',theme:'lilac',desc:'Dành cho sinh viên và ứng viên mới tốt nghiệp.'},
{id:'port-dark',name:'Creative Showcase',type:'portfolio',category:'Design',style:'Creative',level:'All',theme:'dark',desc:'Portfolio nổi bật với phong cách trình bày đậm.'},
{id:'port-min',name:'Personal Minimal',type:'portfolio',category:'Personal',style:'Minimal',level:'All',theme:'light',desc:'Giới thiệu cá nhân và dự án tinh gọn.'},
{id:'port-lilac',name:'Digital Presence',type:'portfolio',category:'IT',style:'Modern',level:'All',theme:'lilac',desc:'Trình bày năng lực số và sản phẩm.'},

{id:'poster-hire',name:'We Are Hiring',type:'poster',category:'Recruitment',style:'Corporate',level:'All',theme:'light',desc:'Poster tuyển dụng doanh nghiệp.'},

{id:'poster-event',name:'Event Announcement',type:'poster',category:'Event',style:'Elegant',level:'All',theme:'rose',desc:'Poster sự kiện, hội thảo, workshop.'},

];
const defaults={
cv:{full_name:'Nguyễn Minh Anh',role:'Chuyên viên Nhân sự',email:'minhanh@email.com',phone:'0900 000 000',location:'TP. Hồ Chí Minh',summary:'Ứng viên chủ động, có tư duy hệ thống và khả năng phối hợp đa phòng ban.',experience:'2024 – Nay | Công ty ABC\\nChuyên viên Nhân sự\\n• Quản lý hồ sơ, tuyển dụng và báo cáo nhân sự.\\n• Phối hợp chấm công, tính lương và chế độ.',education:'Đại học XYZ | Quản trị Nguồn nhân lực\\n2020 – 2024',skills:'Tuyển dụng • C&B • Excel • Giao tiếp',language:'Tiếng Việt • English'},
portfolio:{full_name:'Minh Anh',role:'Creative Professional',tagline:'Make ideas visible.',about:'Tôi kết hợp tư duy chiến lược và khả năng sáng tạo để tạo ra những trải nghiệm có giá trị.',email:'hello@email.com',location:'Ho Chi Minh City',projects:'01 — Brand identity\\nXây dựng hệ thống nhận diện thương hiệu.\\n\\n02 — Digital experience\\nThiết kế trải nghiệm số lấy người dùng làm trung tâm.',skills:'Strategy • Design • Communication • Research'},
poster:{title:'WE ARE HIRING',headline:'TÌM ĐỒNG ĐỘI MỚI',subheadline:'Cùng phát triển những điều khác biệt',company:'CANVIO Studio',role:'Marketing Executive • HR Assistant',details:'Môi trường năng động\\nĐào tạo & phát triển\\nThu nhập cạnh tranh',contact:'careers@company.com | 0900 000 000'}
};
let user=null, page='dashboard', designs=[], current=null, activeTemplate=null, search='', typeFilter='all', categoryFilter='all';
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function templateCard(t){return `<article class="template"><div class="thumb ${t.theme==='dark'?'dark':t.theme==='rose'?'rose':t.theme==='lilac'?'lilac':''}"><div class="fake-name">${esc(t.type==='poster'?'YOUR NEXT CHAPTER':t.type==='portfolio'?'HELLO, I AM':t.name)}</div><div class="fake-line"></div><div class="fake-line short"></div><div class="fake-line"></div><div class="fake-line short"></div></div><div class="template-info"><h3>${esc(t.name)}</h3><div class="muted small">${esc(t.desc)}</div><span class="tag">${esc(t.type.toUpperCase())}</span><span class="tag">${esc(t.category)}</span><div class="row" style="margin-top:12px"><button class="btn primary" onclick="useTemplate('${t.id}')">Sử dụng mẫu</button><button class="btn ghost" onclick="previewTemplate('${t.id}')">Xem</button></div></div></article>`}
function shell(){return `<div class="app"><aside class="sidebar"><div class="brand">CANV<span>IO</span><small>CREATE BEYOND LIMITS</small></div><div class="nav">${[['dashboard','◈','Tổng quan'],['templates','▦','Thư viện mẫu'],['cv','▤','CV Studio'],['portfolio','◇','Portfolio Studio'],['poster','▧','Poster Studio'],['designs','▣','Thiết kế của tôi']].map(([id,ic,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${ic}</b>${n}</button>`).join('')}</div><div class="sidebottom"><div class="muted small">${esc(user?.email||'')}</div><button class="btn ghost" style="width:100%;margin-top:10px" onclick="logout()">Đăng xuất</button></div></aside><main class="main"><header class="topbar"><div class="row"><button class="btn mobilemenu" onclick="toggleMobile()">☰</button><h1>${pageTitle()}</h1></div><div class="row"><span class="muted small">${esc(user?.email||'')}</span><button class="btn primary" onclick="newDesign('cv')">＋ Tạo thiết kế</button></div></header><div class="content" id="view"></div></main></div>`}
function pageTitle(){return ({dashboard:'Tổng quan sáng tạo',templates:'Template Marketplace',cv:'CV Studio',portfolio:'Portfolio Studio',poster:'Poster Studio',designs:'Thiết kế của tôi',editor:'Design Editor'})[page]||'CANVIO'}
function go(p){page=p;render();if(p==='cv'||p==='portfolio'||p==='poster')newDesign(p,false)}
function render(){if(!user){authView();return}$('#root').innerHTML=shell();const v=$('#view');if(page==='dashboard')v.innerHTML=dashboard();else if(page==='templates')v.innerHTML=library();else if(page==='designs')v.innerHTML=libraryDesigns();else if(['cv','portfolio','poster','editor'].includes(page))v.innerHTML=editorView();bindDynamic()}
function dashboard(){return `<section class="hero"><div class="eyebrow">CANVIO CREATIVE CAREER STUDIO</div><h2>Make your potential<br>visible.</h2><p>Tạo CV chuyên nghiệp, portfolio ấn tượng và ấn phẩm tuyển dụng trong một không gian sáng tạo duy nhất.</p><div class="row"><button class="btn primary" onclick="go('templates')">Khám phá thư viện mẫu</button><button class="btn" onclick="newDesign('cv')">Bắt đầu thiết kế</button></div></section><div class="grid"><div class="stat"><span class="muted">Thiết kế của tôi</span><strong>${designs.length}</strong></div><div class="stat"><span class="muted">Mẫu sáng tạo</span><strong>${templates.length}+</strong></div><div class="stat"><span class="muted">Không gian làm việc</span><strong>01</strong></div></div><div class="sectionhead"><h2>Bắt đầu sáng tạo</h2><button class="btn ghost" onclick="go('templates')">Xem tất cả →</button></div><div class="grid"><div class="card"><div class="eyebrow">01 / CAREER</div><h3>CV Studio</h3><p class="muted">Xây dựng CV rõ ràng, chuyên nghiệp và dễ đọc.</p><button class="btn primary" onclick="newDesign('cv')">Tạo CV</button></div><div class="card"><div class="eyebrow">02 / PERSONAL BRAND</div><h3>Portfolio Studio</h3><p class="muted">Kể câu chuyện năng lực qua dự án và dấu ấn cá nhân.</p><button class="btn primary" onclick="newDesign('portfolio')">Tạo Portfolio</button></div><div class="card"><div class="eyebrow">03 / BUSINESS</div><h3>Poster Studio</h3><p class="muted">Tạo poster tuyển dụng, sự kiện và truyền thông.</p><button class="btn primary" onclick="newDesign('poster')">Tạo Poster</button></div></div><div class="sectionhead"><h2>Mẫu nổi bật</h2><button class="btn ghost" onclick="go('templates')">Mở thư viện →</button></div><div class="template-grid">${templates.slice(0,4).map(templateCard).join('')}</div>`}
function library(){let list=templates.filter(t=>(typeFilter==='all'||t.type===typeFilter)&&(categoryFilter==='all'||t.category===categoryFilter)&&(`${t.name} ${t.desc} ${t.category} ${t.style}`).toLowerCase().includes(search.toLowerCase()));return `<div class="hero"><div class="eyebrow">TEMPLATE MARKETPLACE</div><h2>Find your style.<br>Create your story.</h2><p>Chọn điểm khởi đầu phù hợp, sau đó cá nhân hóa nội dung và phong cách của bạn.</p></div><div class="filters"><input id="templateSearch" placeholder="Tìm mẫu, ngành nghề, phong cách..." value="${esc(search)}"><select id="typeFilter"><option value="all">Tất cả loại</option><option value="cv">CV</option><option value="portfolio">Portfolio</option><option value="poster">Poster</option></select><select id="categoryFilter"><option value="all">Tất cả danh mục</option>${['Corporate','ATS','Creative','IT','HR','Finance','Student','Design','Personal','Recruitment','Event','Business'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="sectionhead"><h2>${list.length} mẫu thiết kế</h2><span class="muted small">Bộ sưu tập CANVIO</span></div><div class="template-grid">${list.length?list.map(templateCard).join(''):'<div class="empty">Không tìm thấy mẫu phù hợp.</div>'}</div>`}
function libraryDesigns(){return `<div class="row" style="margin-bottom:18px"><input id="designSearch" placeholder="Tìm thiết kế..." value="${esc(search)}" style="max-width:350px;background:#0f1426;border:1px solid var(--line);border-radius:10px;padding:10px;color:white"><button class="btn primary" onclick="newDesign('cv')">＋ Tạo mới</button></div><div class="grid">${designs.filter(d=>(d.title||'').toLowerCase().includes(search.toLowerCase())).map(d=>`<div class="card"><div class="eyebrow">${esc(d.design_type||'design')}</div><h3>${esc(d.title)}</h3><p class="muted small">Cập nhật: ${new Date(d.updated_at||d.created_at||Date.now()).toLocaleString('vi-VN')}</p><div class="row"><button class="btn primary" onclick="editDesign('${d.id}')">Mở</button><button class="btn" onclick="duplicateDesign('${d.id}')">Nhân bản</button><button class="btn danger" onclick="deleteDesign('${d.id}')">Xóa</button></div></div>`).join('')||'<div class="empty">Chưa có thiết kế. Hãy tạo thiết kế đầu tiên.</div>'}</div>`}
function newDesign(type,rerender=true){current={id:null,title:type==='cv'?'CV chưa đặt tên':type==='portfolio'?'Portfolio chưa đặt tên':'Poster chưa đặt tên',design_type:type,content:JSON.parse(JSON.stringify(defaults[type]))};activeTemplate=null;page=type;if(rerender)render();else renderEditorOnly()}
function renderEditorOnly(){const v=$('#view');if(v)v.innerHTML=editorView()}
function editorView(){if(!current){current={id:null,title:'Thiết kế mới',design_type:['cv','portfolio','poster'].includes(page)?page:'cv',content:JSON.parse(JSON.stringify(defaults[['cv','portfolio','poster'].includes(page)?page:'cv']))}}const c=current.content||{};let fields=Object.keys(c);return `<div class="row no-print" style="margin-bottom:15px"><input id="designTitle" value="${esc(current.title)}" style="max-width:300px;background:#0f1426;border:1px solid var(--line);border-radius:10px;padding:10px;color:white"><button class="btn primary" onclick="saveDesign()">Lưu thiết kế</button><button class="btn" onclick="window.print()">Xuất PDF</button><button class="btn" onclick="shareDesign()">Chia sẻ</button><button class="btn ghost" onclick="go('templates')">Đổi mẫu</button></div><div class="editor"><section class="panel editorform"><div class="sectionhead" style="margin-top:0"><h2>Nội dung thiết kế</h2><span class="tag">${current.design_type.toUpperCase()}</span></div>${fields.map(k=>`<div class="field"><label>${fieldLabel(k)}</label><textarea data-field="${k}">${esc(c[k])}</textarea></div>`).join('')}<div class="field"><label>Màu nhấn</label><input type="color" id="accentColor" value="${current.accent||'#b99a5a'}"></div><div class="field"><label>Kiểu hiển thị</label><select id="layoutStyle"><option value="classic">Classic</option><option value="modern">Modern</option><option value="minimal">Minimal</option></select></div><button class="btn primary" style="width:100%" onclick="saveDesign()">Lưu vào thiết kế của tôi</button></section><section><div class="previewwrap"><div id="paper" class="paper ${current.design_type==='portfolio'?'portfolio-paper':current.design_type==='poster'?'poster-paper':''}">${previewHtml(c,current.design_type)}</div></div><p class="muted small no-print" style="text-align:center">Bản xem trước được cập nhật khi bạn chỉnh sửa nội dung.</p></section></div>`}
function fieldLabel(k){return ({full_name:'Họ và tên',role:'Chức danh / Vị trí',email:'Email',phone:'Số điện thoại',location:'Địa điểm',summary:'Tóm tắt bản thân',experience:'Kinh nghiệm làm việc',education:'Học vấn',skills:'Kỹ năng',language:'Ngoại ngữ',tagline:'Thông điệp cá nhân',about:'Giới thiệu',projects:'Dự án tiêu biểu',title:'Tiêu đề chính',headline:'Thông điệp nổi bật',subheadline:'Thông điệp phụ',company:'Tên doanh nghiệp',details:'Thông tin / Quyền lợi',contact:'Thông tin liên hệ'})[k]||k}
function previewHtml(c,type){if(type==='poster')return `<div class="eyebrow">CANVIO CREATIVE STUDIO</div><h1>${esc(c.title)}</h1><h2>${esc(c.headline)}</h2><p>${esc(c.subheadline)}</p><div style="height:2px;background:#b99a5a;width:70%;margin:30px auto"></div><h2>${esc(c.company)}</h2><p><b>${esc(c.role)}</b></p><p>${esc(c.details)}</p><p style="margin-top:35px">${esc(c.contact)}</p>`;if(type==='portfolio')return `<div class="eyebrow">PERSONAL PORTFOLIO</div><h1>${esc(c.full_name)}</h1><div class="role">${esc(c.role)}</div><h2>${esc(c.tagline)}</h2><p>${esc(c.about)}</p><h2>Selected Projects</h2><p>${esc(c.projects)}</p><h2>Core Skills</h2><p>${esc(c.skills)}</p><p class="contact">${esc(c.email)} · ${esc(c.location)}</p>`;return `<h1>${esc(c.full_name)}</h1><div class="role">${esc(c.role)}</div><div class="contact">${esc(c.email)} · ${esc(c.phone)} · ${esc(c.location)}</div><h2>Professional Summary</h2><p>${esc(c.summary)}</p><h2>Work Experience</h2><p>${esc(c.experience)}</p><h2>Education</h2><p>${esc(c.education)}</p><h2>Skills</h2><p>${esc(c.skills)}</p><h2>Languages</h2><p>${esc(c.language)}</p>`}
function bindDynamic(){document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{current.content[el.dataset.field]=el.value;const paper=$('#paper');if(paper)paper.innerHTML=previewHtml(current.content,current.design_type)}));const ts=$('#templateSearch');if(ts)ts.addEventListener('input',e=>{search=e.target.value;const y=e.target.selectionStart;const v=$('#view');v.innerHTML=library();$('#templateSearch').focus();$('#templateSearch').setSelectionRange(y,y);bindDynamic()});const tf=$('#typeFilter');if(tf){tf.value=typeFilter;tf.onchange=e=>{typeFilter=e.target.value;render()}}const cf=$('#categoryFilter');if(cf){cf.value=categoryFilter;cf.onchange=e=>{categoryFilter=e.target.value;render()}}const ds=$('#designSearch');if(ds)ds.oninput=e=>{search=e.target.value;render()};const title=$('#designTitle');if(title)title.oninput=e=>current.title=e.target.value;const accent=$('#accentColor');if(accent)accent.oninput=e=>{current.accent=e.target.value;const p=$('#paper');if(p)p.style.setProperty('--accent',e.target.value)}}
function useTemplate(id){const t=templates.find(x=>x.id===id);if(!t)return;newDesign(t.type);activeTemplate=t.id;current.title=t.name+' — thiết kế mới';current.template_id=t.id;render();toast('Đã mở mẫu '+t.name)}
function previewTemplate(id){const t=templates.find(x=>x.id===id);if(!t)return;toast(t.name+' · '+t.desc)}
async function loadDesigns(){if(!user)return;const {data,error}=await db.from('designs').select('id,title,design_type,status,content,created_at,updated_at').order('updated_at',{ascending:false}).limit(100);if(error){console.warn(error);toast('Không tải được thiết kế: '+error.message);return}designs=data||[]}
async function saveDesign(){if(!user)return toast('Vui lòng đăng nhập');current.title=$('#designTitle')?.value||current.title;const row={user_id:user.id,title:current.title,design_type:current.design_type,status:'draft',content:current.content,updated_at:new Date().toISOString()};let q=current.id?db.from('designs').update(row).eq('id',current.id).select().single():db.from('designs').insert(row).select().single();const {data,error}=await q;if(error){toast('Lưu thất bại: '+error.message);return}current.id=data.id;await loadDesigns();toast('Đã lưu thiết kế');}
function editDesign(id){const d=designs.find(x=>x.id===id);if(!d)return;current={...d,content:d.content||{}};page=d.design_type;render()}
async function duplicateDesign(id){const d=designs.find(x=>x.id===id);if(!d)return;const {data,error}=await db.from('designs').insert({user_id:user.id,title:d.title+' (Bản sao)',design_type:d.design_type,status:'draft',content:d.content}).select().single();if(error)toast(error.message);else{await loadDesigns();render();toast('Đã nhân bản')}}
async function deleteDesign(id){if(!confirm('Xóa thiết kế này?'))return;const {error}=await db.from('designs').delete().eq('id',id);if(error)toast(error.message);else{await loadDesigns();render();toast('Đã xóa')}}
async function shareDesign(){if(!current?.id){toast('Hãy lưu thiết kế trước khi chia sẻ');return}const {data,error}=await db.from('portfolio_shares').upsert({design_id:current.id,user_id:user.id,is_active:true},{onConflict:'design_id'}).select('share_token').single();if(error){toast('Không tạo được liên kết: '+error.message);return}const url=location.origin+location.pathname+'#share='+data.share_token;try{await navigator.clipboard.writeText(url);toast('Đã sao chép liên kết chia sẻ')}catch{prompt('Sao chép liên kết:',url)}}
async function loadShared(token){const {data,error}=await db.rpc('canvio_get_shared_design',{p_token:token});if(error||!data?.length){$('#root').innerHTML='<div class="empty">Liên kết không tồn tại hoặc đã bị tắt.</div>';return}const d=data[0];$('#root').innerHTML=`<div class="content"><div class="brand">CANV<span>IO</span></div><div class="previewwrap" style="margin-top:25px"><div class="paper">${previewHtml(d.content||{},d.design_type)}</div></div></div>`}
function authView(){const mode=window.authMode||'login';$('#root').innerHTML=`<div class="auth"><div class="authbox"><div class="authart"><div class="brand">CANV<span>IO</span><small>CREATE BEYOND LIMITS</small></div><div><div class="eyebrow">YOUR CREATIVE CAREER STUDIO</div><h1 style="font-size:42px;line-height:1.08">Make your<br>potential visible.</h1><p>CV. Portfolio. Business creativity. All in one place.</p></div><span class="small muted">© CANVIO Studio</span></div><div class="authform"><h2>${mode==='login'?'Chào mừng trở lại':'Tạo tài khoản CANVIO'}</h2><p class="muted">${mode==='login'?'Đăng nhập để tiếp tục sáng tạo.':'Bắt đầu xây dựng dấu ấn nghề nghiệp của bạn.'}</p><form id="authForm"><div class="field"><label>Email</label><input id="authEmail" type="email" required placeholder="you@email.com"></div>${mode==='signup'?'<div class="field"><label>Họ và tên</label><input id="authName" required placeholder="Tên của bạn"></div>':''}<div class="field"><label>Mật khẩu</label><input id="authPassword" type="password" minlength="6" required placeholder="Tối thiểu 6 ký tự"></div><button class="btn primary" style="width:100%;margin-top:8px">${mode==='login'?'Đăng nhập':'Đăng ký'}</button></form><p class="muted small" style="margin-top:20px">${mode==='login'?'Chưa có tài khoản?':'Đã có tài khoản?'} <a href="#" onclick="authMode='${mode==='login'?'signup':'login'}';authView();return false" style="color:var(--gold)">${mode==='login'?'Đăng ký':'Đăng nhập'}</a></p><p class="muted small">Đăng nhập được xử lý bởi Supabase Auth.</p></div></div></div>`;$('#authForm').onsubmit=authSubmit}
async function authSubmit(e){e.preventDefault();const email=$('#authEmail').value,password=$('#authPassword').value;let res;if(window.authMode==='signup')res=await db.auth.signUp({email,password,options:{data:{full_name:$('#authName').value}}});else res=await db.auth.signInWithPassword({email,password});if(res.error){toast(res.error.message);return}if(!res.data.session){toast('Kiểm tra email để xác nhận tài khoản.');return}user=res.data.user;await afterLogin()}
async function afterLogin(){await loadDesigns();page='dashboard';render()}
async function logout(){await db.auth.signOut();user=null;designs=[];authMode='login';authView()}
function toggleMobile(){const s=document.querySelector('.sidebar');if(!s)return;s.style.display=s.style.display==='flex'?'none':'flex';s.style.position='absolute';s.style.zIndex=10;s.style.height='100vh'}
function readShare(){const m=location.hash.match(/share=([a-f0-9-]+)/i);return m?.[1]||null}
async function init(){const token=readShare();if(token){await loadShared(token);return}const {data}=await db.auth.getSession();if(data.session){user=data.session.user;await afterLogin()}else authView();db.auth.onAuthStateChange((_e,s)=>{if(s?.user){user=s.user;afterLogin()}else if(user){user=null;authView()}})}
init();
</script>
</body></html>
